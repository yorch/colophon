name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Lint (architecture rules)
        run: yarn lint:arch

      - name: Typecheck
        run: yarn tsc

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build publisher image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: colophon-cli:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image against this repo's own docs
        run: |
          docker run --rm -v "$PWD:/work" -w /work colophon-cli:ci \
            validate ./docs

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # The production full-text path is Postgres-only — tsvector, ts_rank and a
    # GIN index. Without a real server the database suite runs against SQLite
    # alone and that SQL ships unexercised, so CI provides one.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: colophon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      BACKSTAGE_TEST_DATABASE_POSTGRES18_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/colophon_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Lint (architecture rules)
        run: yarn lint:arch

      - name: Typecheck
        run: yarn tsc

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build publisher image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: colophon-cli:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image against this repo's own docs
        run: |
          docker run --rm -v "$PWD:/work" -w /work colophon-cli:ci \
            validate ./docs

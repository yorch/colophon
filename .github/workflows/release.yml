# Publishes the packages to npm.
#
# Two-step by design. A push to main that carries changesets makes this open a
# "Version Packages" pull request: version bumps, updated interdependencies and
# generated changelogs, as a diff to review. Merging that pull request is what
# publishes. Nothing reaches npm without a human approving the version numbers,
# and an npm version cannot be unpublished after 72 hours.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing. Lets the job mint an OIDC token so npm can verify
  # the release came from this workflow in this repository, with no long-lived
  # credential and a provenance attestation on the published package.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets compares against the base branch to decide what to
          # release, which a shallow clone cannot answer.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      # The same checks main is already required to pass. Publishing is the one
      # action in this repository that cannot be undone, so it does not inherit
      # trust from an earlier run.
      - name: Verify
        run: yarn verify

      # Pinned by commit rather than by the `v2` tag. A moving major tag is
      # the exact vector of CVE-2025-30066, where tags v1 through v45.0.7 of
      # a popular action were repointed at a commit that dumped runner memory
      # into workflow logs. This job can mint an npm publishing token, so it
      # is the last place to accept a dependency that can change underneath.
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: yarn version-packages
          publish-script: yarn release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # The five packages share one version, so a release per package
          # would be five near-identical entries per version, and nothing to
          # point at when someone asks what is in 0.1.0. One consolidated
          # release is created below instead.
          create-github-releases: false
          # Independent of the above in v2 — in v1 the two were coupled, and
          # turning releases off silently stopped tags being pushed at all.
          # Off here for the same reason: per-package tags would contradict
          # the single `v0.1.0`-style tag the step below creates.
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm credential, deliberately. Publishing authenticates with the
          # OIDC token minted by `id-token: write` above, which Yarn exchanges
          # itself from 4.9.0 onwards.
          #
          # npm cannot configure a trusted publisher for a package that does
          # not exist yet (npm/cli#8544), so the first publish of each package
          # is done from a maintainer's machine with `yarn npm login` and a
          # real 2FA prompt — see CONTRIBUTING.md. That is a deliberate
          # alternative to a bypass-2FA token living in this repository's
          # secrets: it removes the credential rather than guarding it.

      # One release for the version, not one per package — the five share a
      # version, so the default would be five near-identical entries and
      # nothing to link to when someone asks what is in 0.1.0.
      #
      # `gh` rather than an action: GitHub's own actions/create-release has
      # been archived since 2021, and the CLI is both maintained and already
      # on the runner. It creates the tag itself when one does not exist,
      # which is why there is no git tag/push here.
      #
      # Deliberately *not* gated on `steps.changesets.outputs.published`, and
      # deliberately not fed by `publishedPackages`. The action derives both by
      # regex-matching `New tag: <pkg>@<version>` lines out of the publish
      # script's stdout (`src/run.ts`), and changesets v3 stopped printing that
      # line — it reports `◇ Successfully published:` from a progress UI now.
      # So 0.1.1 went to npm with `published` still reading `false` and this
      # step skipped, in a run that reported success. Nothing here parses
      # another tool's console output any more: the version is read from the
      # manifests, and the tag's existence is what says whether the release has
      # already been made.
      - name: Tag and release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The version being released is whatever the manifests on the commit
          # under test carry: merging the "chore: version packages" pull
          # request is what bumps them, and this job is what publishes them.
          # The fixed group in the changesets config is the list of packages
          # that share it, so it stays the single source of truth for the five.
          #
          # Read out of the commit, not the working tree, and out of the same
          # commit the tag below is pinned to. `changesets/action` runs
          # `changeset version` in this checkout to build the version pull
          # request, so on a push that merely opens or updates that pull
          # request the manifests on disk carry a version nothing has
          # published. Reading those is how v0.1.2 came to exist as a tag and
          # a GitHub release with nothing behind it on npm, tagged on a
          # feature merge, and how v0.2.0's tag landed on a feature merge
          # rather than on the commit that published it.
          group=$(jq -c '.fixed[0]' .changeset/config.json)
          packages=$(
            yarn workspaces list --json |
              jq -r --argjson group "$group" '
                select(.name as $n | $group | index($n)) | .location
              ' |
              sort |
              while read -r location; do
                git show "$GITHUB_SHA:$location/package.json" |
                  jq -r '"\(.name) \(.version)"'
              done
          )
          versions=$(awk '{ print $2 }' <<< "$packages" | sort -u)

          # The fixed group's premise is one version across all five. If that
          # ever stops holding — or a name in the group no longer matches a
          # workspace — fail loudly rather than labelling the tag with
          # whichever version happens to come first.
          if [ "$(wc -l <<< "$packages")" -ne "$(jq 'length' <<< "$group")" ] ||
             [ "$(wc -l <<< "$versions")" -ne 1 ]; then
            echo "Expected one version across the fixed group, got:" >&2
            sed 's/^/  /' <<< "$packages" >&2
            echo >&2
            echo 'Check the "fixed" group in .changeset/config.json.' >&2
            exit 1
          fi
          tag="v$versions"

          # Hand the same repo-derived list to the dist-tag check below, so
          # the fixed group is still named in exactly one place.
          {
            echo 'packages<<PACKAGES_EOF'
            echo "$packages"
            echo 'PACKAGES_EOF'
          } >> "$GITHUB_OUTPUT"

          # The tag is the record of what has been released. Every push to main
          # that does not bump the version finds it already there and stops,
          # which is the same property that makes re-running a release safe.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released."
            echo 'released=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A fixed group shares its changesets, so one package's entry is the
          # release notes and the other four would repeat it. Stop at the next
          # heading so older versions do not leak in.
          awk -v v="$versions" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' packages/colophon-common/CHANGELOG.md > release-notes.md

          {
            printf '\n### Packages\n\n'
            awk '{ printf "- `%s@%s` — https://www.npmjs.com/package/%s/v/%s\n", $1, $2, $1, $2 }' <<< "$packages"
          } >> release-notes.md

          # Pin the tag to the commit this job ran on. Without --target `gh`
          # tags whatever the default branch points at when the call lands,
          # which is a different commit if anything else merged meanwhile.
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md

          echo 'released=true' >> "$GITHUB_OUTPUT"

      # Where `latest` points is the only thing most consumers ever see, and
      # until now nothing in this pipeline had an opinion about it. `changeset
      # publish --tag next` sent four consecutive releases to the `next`
      # dist-tag while `latest` stayed on 0.1.0 — real publishes, correct
      # versions, a GitHub release each time, four green runs, and
      # `npm install @brnby/plugin-colophon` still resolving to the first
      # release. A publish that lands on the wrong dist-tag is invisible from
      # inside the pipeline unless something asks the registry.
      #
      # Gated on the step above having created the release, which is the same
      # question as whether this run published: the version comes from the
      # commit, so a push that releases nothing finds its tag already there
      # and this is skipped. Asking the registry on every push would catch a
      # dist-tag moved out of band too, but it would also hold main red for a
      # stale `latest` that only a human with npm 2FA can repair — and a main
      # that stays red for something the run did not do teaches people to
      # ignore red.
      - name: Check dist-tags
        if: steps.release.outputs.released == 'true'
        env:
          # The fixed group with the version this run released, from the same
          # repo-derived list the step above tagged.
          PACKAGES: ${{ steps.release.outputs.packages }}
        run: |
          set -euo pipefail

          # npm's registry reads are cached, so `latest` can still answer with
          # the previous version for a few seconds after the publish that moved
          # it — long enough for a single check here to fail a release that was
          # in fact correct. Poll instead, with `--prefer-online` so each
          # attempt revalidates rather than re-reading the same cached answer,
          # and only re-ask about the packages that have not settled.
          attempts=8
          delay=15
          pending=$PACKAGES
          for attempt in $(seq "$attempts"); do
            pending=$(
              while read -r name version _; do
                actual=$(npm view "$name@latest" version --prefer-online 2>/dev/null || true)
                [ "$actual" = "$version" ] && continue
                printf '%s %s %s\n' "$name" "$version" "${actual:-<none>}"
              done <<< "$pending"
            )
            [ -n "$pending" ] || break
            [ "$attempt" -eq "$attempts" ] || sleep "$delay"
          done

          if [ -n "$pending" ]; then
            {
              echo 'The `latest` dist-tag does not point at the released version.'
              echo
              printf '  %-34s %-10s %s\n' PACKAGE RELEASED 'latest points at'
              awk '{ printf "  %-34s %-10s %s\n", $1, $2, $3 }' <<< "$pending"
              echo
              echo 'Where the version is on the registry, a published version cannot be'
              echo 'republished, so the repair is to move the tag by hand — from a'
              echo 'maintainer machine, with 2FA:'
              echo
              awk '{ printf "  npm dist-tag add %s@%s latest\n", $1, $2 }' <<< "$pending"
              echo
              echo 'Where it is not, this run tagged and released a version with no'
              echo 'publish behind it, and no dist-tag will fix that.'
              echo
              echo 'Either way, work out why the release did not do it: check `release`'
              echo 'in the root package.json for a `--tag`, `publishConfig.tag` in the'
              echo 'package manifests, and .changeset/pre.json for a pre-release mode'
              echo 'that was never exited.'
            } >&2
            exit 1
          fi

          echo 'latest points at the released version for every package.'
